name: Aggiorna dati aziende

on:
  schedule:
    - cron: "0 3 * * 1"   # ogni lunedì alle 03:00 UTC
  workflow_dispatch:
    inputs:
      regioni:
        description: "Regioni (es. IT-25,IT-45) oppure 'tutte'"
        default: "tutte"
      max_siti:
        description: "Siti da analizzare in questa esecuzione"
        default: "600"
      fiere:
        description: "Cataloghi fiere (catalogo.fiereparma.it) separati da virgola, oppure 'no'"
        default: "tuttofood-2026,cibus-2024"
      max_schede_fiere:
        description: "Schede espositore nuove da leggere per fiera in questa esecuzione"
        default: "500"
      ristorazione:
        description: "Cerca anche catene di pizzerie e ristorazione organizzata"
        type: boolean
        default: true
      salta_scoperta:
        description: "Salta OpenStreetMap e arricchisci solo i dati già raccolti"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  raccolta:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Raccolta e arricchimento
        run: |
          ARGS="--regioni ${{ inputs.regioni || 'tutte' }} --max-siti ${{ inputs.max_siti || '600' }} --fiere ${{ inputs.fiere || 'tuttofood-2026,cibus-2024' }} --max-schede-fiere ${{ inputs.max_schede_fiere || '500' }}"
          if [ "${{ inputs.salta_scoperta }}" = "true" ]; then ARGS="$ARGS --salta-scoperta"; fi
          if [ "${{ inputs.ristorazione }}" = "false" ]; then ARGS="$ARGS --senza-ristorazione"; fi
          python scraper/raccolta.py $ARGS

      - name: Salva i risultati nel repository
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/aziende.json
          git diff --cached --quiet || git commit -m "Dati aggiornati $(date -u +%Y-%m-%d)"
          git push
